[project]
name = "ha-evecca"
version = "0.1.0"
description = "Home Assistant custom integration for EVECCA smart window controllers"
requires-python = ">=3.14.2"
dependencies = []
[dependency-groups]
dev = [
  "aiohttp>=3.12",
  "aiomqtt==2.5.1",
  "pytest>=9.1",
  "ruff>=0.16"
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PYI",
  "RUF",
  "SIM",
  "TRY",
  "UP",
  "W"
]
ignore = ["TRY003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
